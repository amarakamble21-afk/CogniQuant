<details class="theme-picker">
    <summary aria-label="Open appearance settings">🎨 Appearance</summary>
    <div class="theme-picker-panel">
        <label>
            Color combination
            <select data-theme-setting="palette">
                <option value="mint-ocean">Mint &amp; Deep Ocean</option>
                <option value="lavender-plum">Lavender &amp; Plum</option>
                <option value="peach-rose">Peach &amp; Rose</option>
                <option value="sky-slate">Sky &amp; Slate</option>
            </select>
        </label>
        <label>
            Theme
            <select data-theme-setting="mode">
                <option value="dark">Dark</option>
                <option value="light">Light</option>
            </select>
        </label>
    </div>
</details>
